<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Allocation POC{% endblock %}</title>
    <style>
        :root {
            --blue: #0066cc;
            --blue-light: #e8f0fe;
            --blue-dark: #004499;
            --green: #28a745;
            --green-light: #d4edda;
            --orange: #fd7e14;
            --orange-light: #fff3cd;
            --red: #dc3545;
            --red-light: #f8d7da;
            --gray-50: #f8f9fa;
            --gray-100: #e9ecef;
            --gray-200: #dee2e6;
            --gray-500: #6c757d;
            --gray-700: #495057;
            --gray-900: #212529;
            --radius: 10px;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--gray-50);
            color: var(--gray-900);
            line-height: 1.6;
            min-height: 100vh;
        }

        .navbar {
            background: white;
            border-bottom: 1px solid var(--gray-200);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            font-size: 20px;
            font-weight: 700;
            color: var(--blue);
            text-decoration: none;
        }

        .navbar-brand span {
            color: var(--gray-500);
            font-weight: 400;
            font-size: 14px;
            margin-left: 8px;
        }

        .navbar-links { display: flex; gap: 16px; align-items: center; }

        .navbar-links a {
            color: var(--gray-700);
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .navbar-links a:hover { background: var(--gray-100); }
        .navbar-links a.active { background: var(--blue-light); color: var(--blue); }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: var(--gray-900);
            border-bottom: 2px solid var(--blue);
            padding-bottom: 8px;
            display: inline-block;
        }

        .card h3 {
            font-size: 15px;
            color: var(--gray-700);
            margin-bottom: 12px;
        }

        .btn {
            display: inline-block;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--blue);
            color: white;
        }
        .btn-primary:hover { background: var(--blue-dark); }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
        }
        .btn-secondary:hover { background: var(--gray-200); }

        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--gray-700);
        }

        .form-group .hint {
            font-size: 12px;
            color: var(--gray-500);
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }

        .flash {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .flash-error { background: var(--red-light); color: var(--red); }
        .flash-info { background: var(--blue-light); color: var(--blue); }
        .flash-success { background: var(--green-light); color: var(--green); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; }

        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .container { padding: 16px; }
        }

        .stat-card {
            background: white;
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            border: 1px solid var(--gray-200);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--blue);
        }

        .stat-label {
            font-size: 12px;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--gray-100);
        }

        th {
            font-weight: 600;
            color: var(--gray-700);
            background: var(--gray-50);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:hover td { background: var(--gray-50); }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-green { background: var(--green-light); color: var(--green); }
        .badge-orange { background: var(--orange-light); color: var(--orange); }
        .badge-red { background: var(--red-light); color: var(--red); }
        .badge-blue { background: var(--blue-light); color: var(--blue); }

        .bar-chart-container {
            display: flex;
            gap: 24px;
            align-items: flex-end;
            height: 200px;
            padding: 16px 0;
            border-bottom: 2px solid var(--gray-200);
            margin-bottom: 8px;
        }

        .bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .bar {
            width: 100%;
            max-width: 80px;
            border-radius: 6px 6px 0 0;
            transition: height 0.5s ease;
            min-height: 4px;
        }

        .bar-label {
            font-size: 11px;
            color: var(--gray-500);
            text-align: center;
            word-break: break-word;
        }

        .bar-value {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-900);
        }

        .legend {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
            cursor: pointer;
            padding: 8px 14px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .checkbox-group label:hover {
            border-color: var(--blue);
            background: var(--blue-light);
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        .explanation-box {
            background: var(--gray-50);
            border-left: 4px solid var(--blue);
            padding: 16px;
            margin: 12px 0;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            line-height: 1.7;
        }

        .tab-nav {
            display: flex;
            border-bottom: 2px solid var(--gray-200);
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-500);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--blue);
            border-bottom-color: var(--blue);
        }

        .tab-btn:hover { color: var(--gray-900); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--gray-200);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .text-muted { color: var(--gray-500); }
        .text-center { text-align: center; }
        .mt-8 { margin-top: 8px; }
        .mt-16 { margin-top: 16px; }
        .mb-8 { margin-bottom: 8px; }
        .mb-16 { margin-bottom: 16px; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
